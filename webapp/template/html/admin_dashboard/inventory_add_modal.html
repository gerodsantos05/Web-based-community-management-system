<style>
.inv-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:94;display:none}.inv-modal-backdrop[data-open="true"]{display:block}.inv-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92vw,620px);max-height:88vh;overflow:auto;background:#fff;border:1px solid rgba(15,118,110,.18);border-radius:16px;box-shadow:0 24px 48px rgba(8,83,76,.2);display:none;z-index:95}.inv-modal[data-open="true"]{display:block}.inv-head{display:flex;align-items:center;justify-content:space-between;gap:.65rem;padding:.82rem .95rem;border-bottom:1px solid #deefe8}.inv-title{margin:0;font-size:.96rem;font-weight:700;color:#14352d}.inv-sub{margin:.14rem 0 0;font-size:.72rem;color:#56766c}.inv-btn,.inv-chip{border:1px solid #d4e9e1;border-radius:10px;background:#fff;color:#1b4f43;font-size:.75rem;font-weight:700;padding:.45rem .7rem;display:inline-flex;align-items:center;justify-content:center;gap:.28rem;cursor:pointer}.inv-chip{border-radius:999px;background:#f3fbf7;padding:.24rem .52rem;font-size:.67rem}.inv-grid{padding:.86rem .95rem;display:grid;grid-template-columns:1fr;gap:.6rem}.inv-field{display:grid;gap:.28rem}.inv-field label{font-size:.72rem;font-weight:700;color:#1A4F43}.inv-input{width:100%;box-sizing:border-box;border:1px solid #d4e9e1;border-radius:9px;padding:.62rem .7rem;color:#173a31;background:#fff}
</style>
<style>
@media (max-width:767px){#inv-form-modal{top:100px;bottom:20px;max-height:none;transform:translateX(-50%);overflow-y:auto}}
.inv-modal > .inv-head{position:relative;padding-right:4rem}.inv-modal-close-btn{position:absolute;top:.8rem;right:.9rem;width:2.2rem;height:2.2rem;padding:0;border:1px solid #d4e9e1;border-radius:999px;background:#fff;color:#48665d;font-size:1.2rem;line-height:1;cursor:pointer}
#inv-form > div:last-child{position:sticky;bottom:-.86rem;z-index:1;margin:0 -.95rem -.86rem;padding:.75rem .95rem .86rem;background:#fff;border-top:1px solid #deefe8}
#inv-form > div:last-child .inv-chip{border-radius:999px;background:#f3fbf7;padding:.55rem .8rem;font-size:.95rem}
#inv-form > div:last-child .inv-btn{border:0;border-radius:999px;background:#0f766e;color:#fff;padding:.7rem 1.2rem;font-size:.95rem}
#inv-form > div:last-child .inv-btn:hover{background:#115e52}
</style>
<div id="inv-modal-backdrop" class="inv-modal-backdrop" data-open="false"></div>
<div id="inv-form-modal" class="inv-modal" role="dialog" aria-modal="true" aria-labelledby="inv-form-title" data-open="false">
<header class="inv-head"><div><h3 id="inv-form-title" class="inv-title">Add Item</h3><p class="inv-sub">Create or edit inventory records.</p></div><button type="button" class="inv-modal-close-btn" data-close-form="true" aria-label="Close add item modal" title="Close">×</button></header>
<form id="inv-form" class="inv-grid" novalidate>
<div class="inv-field"><label for="inv-item-name">Item Name</label><input id="inv-item-name" class="inv-input" type="text" required></div>
<div class="inv-field"><label for="inv-item-category">Category</label><select id="inv-item-category" class="inv-input" required><option value="">Select a category</option><option value="store_product">Store Products</option><option value="relief_goods">Relief Goods</option><option value="hygiene_kit">Hygiene Kits</option><option value="school_supplies">School Supplies</option><option value="other">Other</option></select></div>
	<div class="inv-field"><label for="inv-item-qty">Quantity</label><input id="inv-item-qty" class="inv-input" type="number" min="0" required></div>
<div class="inv-field"><label for="inv-item-unit">Unit</label><input id="inv-item-unit" class="inv-input" type="text" required placeholder="pcs, box, bottle"></div>
<div class="inv-field"><label for="inv-item-reorder">Reorder Level</label><input id="inv-item-reorder" class="inv-input" type="number" min="0" required></div>
<div class="inv-field"><label for="inv-item-supplier">Supplier (optional)</label><input id="inv-item-supplier" class="inv-input" type="text"></div>
<div style="display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap"><button type="button" class="inv-chip" data-close-form="true">Cancel</button><button type="submit" class="inv-btn">Save Item</button></div>
</form></div>
<script>
(function(){"use strict";var trigger=document.querySelector('[data-open-add-item="true"]'),modal=document.getElementById("inv-form-modal"),backdrop=document.getElementById("inv-modal-backdrop"),form=document.getElementById("inv-form");if(!trigger||!modal||!backdrop||!form)return;function close(){modal.setAttribute("data-open","false");backdrop.setAttribute("data-open","false");document.body.style.overflow="";form.reset()}function open(){form.reset();document.getElementById("inv-form-title").textContent="Add Item";modal.setAttribute("data-open","true");backdrop.setAttribute("data-open","true");document.body.style.overflow="hidden";document.getElementById("inv-item-name").focus()}trigger.addEventListener("click",open);modal.querySelectorAll("[data-close-form]").forEach(function(button){button.addEventListener("click",close)});backdrop.addEventListener("click",close);form.addEventListener("submit",function(event){event.preventDefault();if(!form.reportValidity())return;var payload={name:document.getElementById("inv-item-name").value.trim(),category:document.getElementById("inv-item-category").value,stock:Number(document.getElementById("inv-item-qty").value||0),unit:document.getElementById("inv-item-unit").value.trim(),low_stock_threshold:Number(document.getElementById("inv-item-reorder").value||0)};fetch("{% url 'inventory_add' %}",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-CSRFToken":document.cookie.split(";").reduce(function(value,cookie){cookie=cookie.trim();return cookie.indexOf("csrftoken=")===0?decodeURIComponent(cookie.substring(10)):value},"")},body:JSON.stringify(payload)}).then(function(response){return response.json().then(function(data){if(!response.ok)throw data;return data})}).then(function(){close();window.location.reload()}).catch(function(error){alert(error.error||"Unable to add item.")})})})();
</script>
