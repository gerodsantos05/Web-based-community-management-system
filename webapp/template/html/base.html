<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Happyness{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/index.css' %}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    {% block extra_head %}{% endblock %}

    <style>
        /* Dashboard layout helpers */
        .dashboard {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
        }

        /* Sidebar */
        .dashboard-sidebar {
            background: rgba(255, 255, 255, 0.68);
            border-right: 1px solid rgba(16, 185, 129, 0.16);
            padding: 2rem 1.5rem;
            position: sticky;
            top: 0;
            height: 100vh;
            align-self: stretch;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .sidebar-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sidebar-avatar {
            width: 54px;
            height: 54px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--mint-500), var(--teal-500));
            color: var(--white);
            font-weight: 700;
            box-shadow: var(--shadow-soft);
        }

        .sidebar-name {
            margin: 0;
            font-weight: 700;
        }

        .sidebar-role {
            margin: 0.2rem 0 0;
            font-size: 0.9rem;
            color: var(--ink-500);
        }

        .sidebar-nav {
            flex: 1;
        }

        .sidebar-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 0.35rem;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0.85rem 1rem;
            border-radius: 16px;
            color: var(--ink-700);
            font-weight: 600;
            transition: background 160ms ease, color 160ms ease;
        }

        .sidebar-link i {
            width: 1.35rem;
            height: 1.35rem;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(16, 185, 129, 0.14);
            color: var(--teal-700);
        }

        /* Main content */
        .dashboard-main {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            padding: 2.5rem 0;
        }

        .dashboard-inner > section {
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }

        .dashboard-inner > section + section {
            border-top: 1px solid rgba(15, 118, 110, 0.12);
        }

        .dashboard-inner {
            width: min(1000px, 100%);
            margin: 0 auto;
            padding-inline: 1.25rem;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .dashboard-brand {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .dashboard-brand .brand-dot {
            width: 2rem;
            height: 2rem;
        }

        .dashboard-brand span {
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .dashboard-header-actions {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(15, 118, 110, 0.3);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--teal-700);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: transform 150ms ease, box-shadow 150ms ease;
        }

        .icon-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(16, 185, 129, 0.18);
        }

        .profile-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            border-radius: 999px;
            border: 1px solid rgba(15, 118, 110, 0.2);
            background: rgba(255, 255, 255, 0.85);
            padding: 0.6rem 0.9rem;
            color: var(--ink-700);
            font-weight: 600;
            cursor: pointer;
            transition: background 150ms ease, box-shadow 150ms ease;
        }

        .profile-btn:hover {
            background: rgba(236, 253, 245, 0.8);
            box-shadow: 0 12px 26px rgba(16, 185, 129, 0.12);
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            padding-top: 0.5rem;
        }

        .dashboard-card {
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(15, 118, 110, 0.14);
            padding: 1.35rem 1.3rem;
            box-shadow: var(--shadow-soft);
            transition: transform 200ms ease, box-shadow 200ms ease;
        }

        .dashboard-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 38px rgba(16, 185, 129, 0.18);
        }

        .dashboard-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .dashboard-card-title {
            margin: 0;
            font-weight: 700;
            color: var(--ink-700);
            font-size: 0.95rem;
        }

        .dashboard-card-value {
            margin: 0;
            font-size: clamp(1.9rem, 2.5vw, 2.5rem);
            font-weight: 800;
            color: #087b68;
        }

        .dashboard-card-icon {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.18), rgba(20, 184, 166, 0.22));
            color: var(--teal-700);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.75rem;
            padding-top: 1rem;
        }

        .dashboard-card-summary {
            padding: 0;
            overflow: hidden;
        }

        .dashboard-card-summary-header {
            padding: 1.2rem 1.25rem;
            background: rgba(15, 118, 110, 0.14);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            border-bottom: 1px solid rgba(15, 118, 110, 0.12);
        }

        .dashboard-card-summary-header h3 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .dashboard-card-summary-value {
            font-weight: 800;
            font-size: 1.85rem;
            color: #087b68;
        }

        .dashboard-card-summary-body {
            padding: 1.1rem 1.25rem 1.3rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
        }

        .dashboard-card-summary-label {
            margin: 0;
            font-weight: 600;
            color: var(--ink-700);
        }

        .dashboard-card-summary-meta {
            margin: 0;
            color: var(--ink-500);
            font-size: 0.9rem;
        }

        .dashboard-chart {
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(15, 118, 110, 0.14);
            box-shadow: var(--shadow-soft);
            padding: 1.75rem 1.5rem 1.8rem;
            margin-top: 1.5rem;
        }

        .dashboard-chart-header {
            margin-bottom: 1.25rem;
        }

        .dashboard-chart-header h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .dashboard-chart-body {
            display: flex;
            justify-content: center;
        }

        .chart-placeholder {
            width: 100%;
            max-width: 860px;
            height: 220px;
            border-radius: 14px;
            background: rgba(16, 185, 129, 0.08);
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            padding: 1.5rem;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.5), rgba(16, 185, 129, 0.22));
            border-radius: 999px;
            max-width: 26px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        .panel-title {
            margin: 0;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }

        .panel-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 0.9rem;
        }

        .panel-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.85rem 1rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(15, 118, 110, 0.1);
        }

        .panel-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: rgba(16, 185, 129, 0.14);
            color: var(--teal-700);
        }

        .panel-item-text {
            margin: 0;
            font-weight: 600;
            color: var(--ink-700);
        }

        .panel-footer {
            margin-top: auto;
            display: flex;
            justify-content: flex-end;
        }

        .panel-footer .btn {
            padding: 0.65rem 1.2rem;
            font-size: 0.95rem;
        }

        @media (max-width: 1024px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .dashboard-sidebar {
                position: relative;
                border-right: none;
                border-bottom: 1px solid rgba(16, 185, 129, 0.16);
                padding: 1.5rem 1.25rem;
            }

            .dashboard-main {
                padding: 1.5rem 0;
            }

            .dashboard-inner {
                padding-inline: 1rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .dashboard-stats {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .dashboard-header-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .dashboard-header-actions .profile-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="bg-brand-50 text-ink-900 antialiased">
    <div id="dashboard-shell" data-sidebar="expanded" class="min-h-screen grid">
        {% include "partials/_sidebar.html" %}

        <main class="min-w-0">
            {% include "partials/_header.html" %}

            <section class="px-4 py-6 md:px-6 lg:px-8" aria-label="Page content">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <div id="mobile-overlay" data-open="false" class="hidden fixed inset-0 z-50 bg-ink-900/30" aria-hidden="true"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{% static 'js/index.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
