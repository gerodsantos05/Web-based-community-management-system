<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Answers to common questions about HappYness Project and its programs.">
    <title>FAQ | HappYness Project</title>
    <link rel="icon" type="image/jpeg" href="{% static 'media/Happyness Project.jpg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/standalone-pages.css' %}">
    <link rel="stylesheet" href="{% static 'css/faq-page.css' %}">
</head>
<body>
    {% include 'partials/_standalone_page_header.html' %}
    <main class="faq-page-main">
        <header class="faq-page-heading">
            <h1>Frequently Asked Questions</h1>
            <p>Everything you need to know about HappYness Project</p>
        </header>
        <div class="faq-page-content">
            {% include 'partials/_faq_content.html' %}
        </div>
    </main>
    <script>
        document.querySelectorAll("[data-faq-question]").forEach(function (button) {
            button.addEventListener("click", function () {
                var item = button.closest(".faq-item");
                var answer = item ? item.querySelector(".faq-answer") : null;

                if (!item || !answer) {
                    return;
                }

                var isOpen = item.classList.contains("is-open");
                item.classList.toggle("is-open", !isOpen);
                button.setAttribute("aria-expanded", String(!isOpen));
                answer.hidden = isOpen;
            });
        });
    </script>
</body>
</html>
